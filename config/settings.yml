# Country hints. A hint that matches the brand's country adds weight.
country_hints:
  TN: [tn, tun, tunisie, tunisia, tunisien, tunisienne, tunis, tounes]
  MA: [ma, maroc, morocco, marocain, maghrib]
  DZ: [dz, algerie, algeria, algerien, djazair]

# Common words that sit one typo away from a brand keyword. Never treated as typosquats.
typo_ignore: [dinar, dinars, sncf, tunisia, tunisian, poster, posted, orange, mobile, mobiles, bankofamerica]

# Small affixes that attackers glue onto brand names (mybiat, biat24, ebiat).
affixes: [my, e, m, i, go, the, new, now, 24, 365, x, pro, plus, direct, bank, banque, tn, ma, dz]

