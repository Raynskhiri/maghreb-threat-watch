# Brands monitored by Maghreb Threat Watch.
#
# Each brand has:
#   id               short unique identifier
#   name             display name
#   country          TN, MA, DZ (used to match country hints like "tn", "tunisie")
#   sector           bank, telecom, post, payments, government, utility, transport
#   keywords         distinctive strings attackers put in lookalike domains
#   weak_keywords    short or generic strings (e.g. "stb", "bna"). These only count
#                    as an exact token and need extra context (a lure word or a
#                    country hint) before anything is reported.
#   official_domains legitimate domains. These and all their subdomains are never flagged.
#
# Official domains were checked against public DNS in Oct 2026. If you spot a
# missing or wrong one, open a pull request.

brands:
